name: Build Linux

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  archlinux:
    name: Arch Linux x86_64
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build and runtime dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel xmake pkgconf qt6-base layer-shell-qt
          wayland wayland-protocols libdeflate wl-clipboard tesseract tesseract-data-eng
          clang

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and run interaction smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xmake f -m release -y
          xmake -y -j
          ./build/snap-smoke ./build/snap-smoke-output

      - name: Stage installation
        run: xmake install -y -o "$PWD/stage/usr"

      - name: Package Linux artifact
        run: |
          version="$(QT_QPA_PLATFORM=offscreen ./build/snap --version | cut -d' ' -f2)"
          archive="snap-${version}-archlinux-x86_64.tar.gz"
          echo "CAPTURE_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "CAPTURE_ARTIFACT=${archive%.tar.gz}" >> "$GITHUB_ENV"
          tar -C stage -czf "$archive" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAPTURE_ARTIFACT }}
          path: ${{ env.CAPTURE_ARCHIVE }}
          if-no-files-found: error

      - name: Attach artifact to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CAPTURE_ARCHIVE }}
